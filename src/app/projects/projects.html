<section id="projects" class="container py-3">
    <h2 class="text-center fw-bold mb-3">
        Projects
    </h2>
    <div class="row g-4 text-center">
        @for(project of projects; track project.title){
        <div class="col-lg-4 col-md-6">
            <div class="card h-100 shadow-lg">
                <img [src]="project.image" class="card-img-top rounded-5 p-3">
                <div class="card-body">
                    <h4>
                        {{project.title}}
                    </h4>
                    <p>
                        {{project.description}}
                    </p>
                    <div>
                        @for(tech of project.technologies; track tech){
                        <span class="badge bg-primary me-2">
                            {{tech}}
                        </span>
                        }
                    </div>
                </div>
                <div class="card-footer">
                    @if(project.hasGitLink){
                        <a [href]="project.github" target="_blank" class="btn btn-dark"> GitHub </a>
                    }@else{<button class="btn btn-secondary" disabled>
                            GitHub
                        </button>
                        }

                </div>
            </div>
        </div>
        }
    </div>
</section>
